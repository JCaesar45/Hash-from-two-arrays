<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quantum Harmonic Visualizer - Real-time audio-reactive particle system">
  <meta name="theme-color" content="#0a0a1a">

  <title>Quantum Harmonic Visualizer</title>

  <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/critical.css">
  <link rel="stylesheet" href="/css/main.css" media="print" onload="this.media='all'">

  <noscript>
    <link rel="stylesheet" href="/css/main.css">
  </noscript>
</head>

<body class="overflow-hidden bg-deep-space">
  <canvas id="particleCanvas" class="fixed inset-0 w-full h-full z-0" aria-label="Interactive particle visualization canvas">
  </canvas>

  <div id="app-root" class="relative z-10">
    <header class="glass-panel fixed top-4 left-1/2 -translate-x-1/2 px-8 py-3 rounded-full backdrop-blur-xl bg-white/5 border border-white/10 shadow-2xl">
      <nav class="flex items-center gap-8">
        <svg class="w-8 h-8 text-cyan-400" viewBox="0 0 32 32" fill="none" stroke="currentColor">
          <path d="M16 2L30 28H2L16 2z" stroke-width="2" stroke-linejoin="round" />
          <circle cx="16" cy="20" r="4" fill="currentColor" opacity="0.3" />
        </svg>
        <div class="flex gap-6 text-sm font-medium tracking-wider uppercase">
          <button class="nav-link text-cyan-300 hover:text-cyan-100 transition-colors" data-panel="visualizer">Visualizer</button>
          <button class="nav-link text-purple-300 hover:text-purple-100 transition-colors" data-panel="hashdemo">Hash Demo</button>
          <button class="nav-link text-emerald-300 hover:text-emerald-100 transition-colors" data-panel="settings">Settings</button>
        </div>
      </nav>
    </header>

    <main id="dynamic-panels" class="min-h-screen flex items-center justify-center">
      <section id="visualizer-panel" class="panel active w-full max-w-7xl mx-auto px-6">
        <div class="grid grid-cols-12 gap-4 mt-24">
          <div class="col-span-3 glass-panel p-6 rounded-3xl">
            <h2 class="text-2xl font-light text-cyan-200 mb-6">Frequency Bands</h2>
            <div id="frequency-bars" class="space-y-2">
              <!-- Generated by JS -->
            </div>
          </div>
          <div class="col-span-6 flex flex-col items-center justify-center">
            <div id="visualization-hub" class="relative w-full aspect-square max-w-lg">
              <div class="absolute inset-0 bg-gradient-radial from-cyan-500/20 to-transparent rounded-full animate-pulse-slow"></div>
            </div>
          </div>
          <div class="col-span-3 glass-panel p-6 rounded-3xl">
            <h2 class="text-2xl font-light text-purple-200 mb-6">Controls</h2>
            <div class="space-y-4">
              <label class="block">
                <span class="text-sm text-gray-300">Particle Count</span>
                <input type="range" id="particleSlider" min="100" max="10000" value="1000" step="100" class="w-full h-2 bg-white/10 rounded-lg appearance-none cursor-pointer accent-cyan-400">
              </label>
              <button id="audioUploadBtn" class="w-full py-3 px-6 bg-gradient-to-r from-cyan-500 to-purple-600 rounded-xl font-semibold text-white shadow-lg hover:shadow-cyan-500/25 transition-all duration-300 transform hover:scale-105">
                Upload Audio
              </button>
              <input type="file" id="audioFileInput" accept="audio/*" class="hidden">
            </div>
          </div>
        </div>
      </section>

      <section id="hashdemo-panel" class="panel hidden w-full max-w-4xl mx-auto px-6">
        <div class="glass-panel p-8 rounded-3xl mt-24">
          <h2 class="text-3xl font-light text-cyan-200 mb-8">Hash Table Visualizer</h2>
          <div class="grid grid-cols-2 gap-8">
            <div>
              <label class="block text-sm text-gray-300 mb-2">Keys Array</label>
              <input type="text" id="keysInput" value='[1, 2, 3, 4, 5]' class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 text-white focus:border-cyan-400 outline-none transition-colors">
            </div>
            <div>
              <label class="block text-sm text-gray-300 mb-2">Values Array</label>
              <input type="text" id="valuesInput" value='["a", "b", "c"]' class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 text-white focus:border-cyan-400 outline-none transition-colors">
            </div>
          </div>
          <button id="generateHashBtn" class="mt-6 py-3 px-8 bg-gradient-to-r from-emerald-500 to-cyan-600 rounded-xl font-semibold text-white shadow-lg hover:shadow-emerald-500/25 transition-all duration-300">
            Generate Hash
          </button>
          <div id="hashResult" class="mt-6 p-6 bg-black/30 rounded-xl font-mono text-lg text-emerald-300 min-h-[60px] break-all">
            {/* Result appears here */}
          </div>
        </div>
      </section>

      <section id="settings-panel" class="panel hidden w-full max-w-4xl mx-auto px-6">
        <div class="glass-panel p-8 rounded-3xl mt-24">
          <h2 class="text-3xl font-light text-purple-200 mb-8">Configuration</h2>
          <div class="grid grid-cols-3 gap-6">
            <div class="col-span-1">
              <label class="block text-sm text-gray-300 mb-2">Color Scheme</label>
              <select id="colorScheme" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-3 text-white focus:border-purple-400 outline-none">
                <option value="aurora">Aurora</option>
                <option value="ocean">Deep Ocean</option>
                <option value="fire">Ethereal Fire</option>
                <option value="cosmic">Cosmic Dust</option>
              </select>
            </div>
            <div class="col-span-1">
              <label class="block text-sm text-gray-300 mb-2">Bloom Intensity</label>
              <input type="range" min="0" max="200" value="100" class="w-full accent-purple-400">
            </div>
            <div class="col-span-1 flex items-end">
              <button id="saveSettings" class="w-full py-3 px-6 bg-gradient-to-r from-purple-500 to-pink-600 rounded-xl font-semibold text-white shadow-lg">
                Apply Settings
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast-container" class="fixed bottom-8 right-8 z-50 flex flex-col gap-3"></div>

  <script type="module" src="/js/app.js"></script>
</body>

</html>
